schema_version: 0.3.0
record_type: shared-field-profile
field_id: field:wind.shared-reasoning.v1
name: Wind Shared Reasoning Field
description: A selectively permeable field for sharing verified knowledge, reusable
  reasoning structures, memory residues, and value traces.
field_kind: composite
origin:
  origin_id: origin:wind.shared-field-concept.v1
  created_by: human:shidenkai-alpha
  created_at: '2026-08-01T06:41:00+09:00'
governance:
  governance_mode: stewarded
  policy_ref: policy:wind-field-governance.v1
  steward_ids:
  - human:shidenkai-alpha
resource_domains:
- knowledge
- memory
- reasoning
- value
access_policy:
  admission_mode: policy-evaluated
  allowed_participant_types:
  - human
  - agent
  - service
  authorization_required: true
  anonymous_access_allowed: false
  allowed_access_scopes:
  - discover
  - read
  - contribute
  - derive
  - redistribute
  default_access_scopes:
  - discover
  - read
permeability_policy:
  inbound:
    origin_trace_required: true
    authorization_receipt_required: true
    audit_required: true
    accepted_classifications:
    - verified
    - provisional
    - recoverable
    rejected_classifications:
    - hazardous
    - private
    - revoked
    - exhausted
  outbound:
    derivative_trace_required: true
    royalty_settlement_required: true
    revocation_propagation_required: true
contribution_policy:
  max_resource_bytes: 2097152
  allowed_content_modes:
  - reference
  required_digest_algorithms:
  - sha256
  duplicate_handling: version
  quarantine_supported: true
retention_policy:
  mode: bounded
  max_retention_seconds: 2592000
  deletion_on_revocation: true
  tombstone_required: true
status: active
created_at: '2026-08-01T06:41:00+09:00'
updated_at: '2026-08-01T09:00:00+09:00'
reuse_policy:
  allowed_reuse_scopes:
  - read
  - derive
  - redistribute
  max_lease_seconds: 3600
  lease_renewal_allowed: false
  max_concurrent_leases_per_resource: 8
  circulation_receipt_required: true
  derived_resource_return_required: true
  expired_lease_action: deny-use
