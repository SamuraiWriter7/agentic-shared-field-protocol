schema_version: 0.5.0
record_type: shared-field-profile
field_id: field:wind.shared-safety.v1
name: Wind Shared Safety Field
description: A federated target field for audited safety patterns, reasoning residues,
  memory, and traceable value.
field_kind: composite
origin:
  origin_id: origin:wind.shared-safety-field.v1
  created_by: human:shidenkai-alpha
  created_at: '2026-08-02T08:00:00+09:00'
governance:
  governance_mode: stewarded
  policy_ref: policy:wind-safety-field-governance.v1
  steward_ids:
  - human:shidenkai-alpha
resource_domains:
- knowledge
- memory
- reasoning
- value
access_policy:
  admission_mode: policy-evaluated
  allowed_participant_types:
  - human
  - agent
  - service
  authorization_required: true
  anonymous_access_allowed: false
  allowed_access_scopes:
  - discover
  - read
  - contribute
  - derive
  - redistribute
  default_access_scopes:
  - discover
  - read
permeability_policy:
  inbound:
    origin_trace_required: true
    authorization_receipt_required: true
    audit_required: true
    accepted_classifications:
    - verified
    - provisional
    - recoverable
    rejected_classifications:
    - hazardous
    - private
    - revoked
    - exhausted
  outbound:
    derivative_trace_required: true
    royalty_settlement_required: true
    revocation_propagation_required: true
contribution_policy:
  max_resource_bytes: 2097152
  allowed_content_modes:
  - reference
  required_digest_algorithms:
  - sha256
  duplicate_handling: version
  quarantine_supported: true
retention_policy:
  mode: bounded
  max_retention_seconds: 2592000
  deletion_on_revocation: true
  tombstone_required: true
status: active
created_at: '2026-08-02T08:00:00+09:00'
updated_at: '2026-08-02T08:00:00+09:00'
reuse_policy:
  allowed_reuse_scopes:
  - read
  - derive
  - redistribute
  max_lease_seconds: 3600
  lease_renewal_allowed: false
  max_concurrent_leases_per_resource: 8
  circulation_receipt_required: true
  derived_resource_return_required: true
  expired_lease_action: deny-use
immune_policy:
  residual_assessment_required: true
  accepted_residual_classifications:
  - recoverable
  - dormant
  - hazardous
  - exhausted
  quarantine_classifications:
  - hazardous
  anomaly_evidence_required_for:
  - hazardous
  quarantine_release_mode: human-review-only
  revocation_propagation_required: true
  max_propagation_depth: 8
  require_known_derivative_coverage: true
  dormant_reassessment_seconds: 86400
  exhausted_action: tombstone
